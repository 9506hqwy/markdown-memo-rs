version: "3"

tasks:
  format:
    deps:
      - format-js
      - format-rs

  format-js:
    cmd: bun run format

  format-rs:
    cmd: cargo fmt --all
    dir: ./src-tauri

  lint:
    deps:
      - lint-js
      - lint-rs

  lint-js:
    cmd: bun run lint

  lint-rs:
    cmd: cargo clippy --all-targets -- -Dwarnings
    dir: ./src-tauri

  debug-build:
    cmd: bun run tauri build --debug

  debug-build-musl:
    cmd: bun run tauri build --debug --target x86_64-unknown-linux-musl

  debug-build-win:
    cmd: bun run tauri build --debug --target x86_64-pc-windows-gnu

  release-build:
    cmd: bun run tauri build

  test:
    cmd: cargo test
    dir: ./src-tauri

  deps-update:
    deps:
      - deps-update-js
      - deps-update-rs

  deps-update-js:
    cmd: bun update

  deps-update-rs:
    cmd: cargo upgrade --incompatible
    dir: ./src-tauri

  license-check-rs:
    cmds:
      - rm -rf ../artifacts/licenses
      - mkdir -p ../artifacts/licenses
      - ../tools/cargo-licenses.sh -o ../artifacts/licenses --target all
    dir: ./src-tauri

  doc-gen:
    cmd: cargo doc
    dir: ./src-tauri

  sbom-gen-rs:
    cmds:
      - mkdir -p ../artifacts
      - find ../artifacts -name "*.sbom.json" -delete
      - ../tools/cargo-sbom.sh -o ../artifacts --all-features -a --no-build-deps
    dir: ./src-tauri
