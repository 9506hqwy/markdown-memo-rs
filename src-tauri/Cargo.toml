[package]
name = "markdown-memo-rs"
version = "0.1.0"
authors = ["9506hqwy"]
# https://github.com/tauri-apps/tauri/issues/10412
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/9506hqwy/markdown-memo-rs"
license = "MIT OR Apache-2.0"
keywords = ["markdown"]
categories = ["development-tools"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
dirs = "7.0.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-cli = "2.5.0"
uuid = { version = "1.29.0", features = ["v4"] }

[profile.release]
strip = "symbols"
lto = true
